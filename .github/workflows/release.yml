name: Release

on:
  push:
    tags:
      - "v*"

# Official artifacts are published only from Wayshard/wayshard on v* tags.
# Custom signing material lives in the GitHub Environment "release" and is
# never available to pull_request CI. Publishing uses the automatic GITHUB_TOKEN.
# Tags containing -rc. / -beta. / -alpha. are GitHub prereleases, never latest.
permissions:
  contents: write

env:
  IS_PRERELEASE: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-alpha.') }}

jobs:
  release:
    name: Official GitHub Release
    runs-on: ubuntu-latest
    if: github.repository == 'Wayshard/wayshard'
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Build web client
        run: |
          bun install --frozen-lockfile
          bun run build
        working-directory: clients
      - name: Embed web into server
        run: |
          # Preserve the tracked .gitkeep so the working tree stays clean; a
          # dirty tree makes the Go build stamp the binaries "+dirty".
          mkdir -p internal/webembed/dist
          find internal/webembed/dist -mindepth 1 ! -name .gitkeep -delete
          cp -a clients/web/dist/. internal/webembed/dist/
      - name: Cross-compile Server and CLI
        run: make build-cross VERSION=${GITHUB_REF_NAME} COMMIT=${GITHUB_SHA}
      - name: Name Go artifacts
        run: |
          chmod +x scripts/release/*.sh scripts/release/*.py
          mkdir -p dist/go
          scripts/release/package-go.sh "${GITHUB_REF_NAME}" bin dist/go
      - name: Generate CycloneDX SBOM
        run: scripts/release/sbom.sh "${GITHUB_REF_NAME}" dist/go
      - name: Copy notices
        run: |
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/go/
      - name: Checksums (Go + SBOM + notices)
        run: |
          python3 scripts/release/checksums.py --out dist/go/SHA256SUMS-go.txt dist/go/*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Wayshard ${{ github.ref_name }}
          body: |
            ## Installing the CLI / TUI

            Download the platform archive (for example
            `wayshard-<tag>-linux-amd64.tar.gz`), extract it, and run
            `./wayshard` for the interactive TUI or `./wayshard help` for the
            scriptable CLI. The archive already contains the `wayshard-tui`
            companion under its canonical runtime name — no rename, no
            `WAYSHARD_TUI` override, and no Bun install are required.

            The standalone `wayshard-<tag>-<os>-<arch>` binary is for advanced
            users and is **not** a functional interactive client on its own: it
            launches the adjacent `wayshard-tui` companion.
          generate_release_notes: true
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: dist/go/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  tui:
    name: CLI+TUI bundle (${{ matrix.asset }})
    needs: release
    if: github.repository == 'Wayshard/wayshard'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            goos: linux
            goarch: amd64
            asset: linux-amd64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            goos: linux
            goarch: arm64
            asset: linux-arm64
          # Intel runner required for the darwin-amd64 TUI bundle.
          # The retired macOS 13 image was replaced by macos-15-intel (standard x86_64 label).
          - os: macos-15-intel
            target: bun-darwin-x64
            goos: darwin
            goarch: amd64
            asset: darwin-amd64
          - os: macos-latest
            target: bun-darwin-arm64
            goos: darwin
            goarch: arm64
            asset: darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            goos: windows
            goarch: amd64
            asset: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install client workspace
        run: bun install --frozen-lockfile
        working-directory: clients
      - name: Build native CLI
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          mkdir -p dist/cli-tui/stage dist/cli-tui/out
          go build -ldflags "-s -w \
            -X github.com/Wayshard/wayshard/internal/version.Version=${GITHUB_REF_NAME} \
            -X github.com/Wayshard/wayshard/internal/version.Commit=${GITHUB_SHA} \
            -X github.com/Wayshard/wayshard/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/cli-tui/stage/wayshard${ext}" ./cmd/wayshard
      - name: Build packaged TUI companion
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          cd clients/tui
          TUI_TARGET=${{ matrix.target }} TUI_OUTFILE="$GITHUB_WORKSPACE/dist/cli-tui/stage/wayshard-tui${ext}" bun run build.ts
      - name: Package CLI+TUI distribution unit
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          bash scripts/release/package-cli-tui.sh "${GITHUB_REF_NAME}" "${{ matrix.goos }}" "${{ matrix.goarch }}" \
            dist/cli-tui/stage dist/cli-tui/out
          # Also publish the raw companion for advanced users.
          cp "dist/cli-tui/stage/wayshard-tui${ext}" \
            "dist/cli-tui/out/wayshard-tui-${GITHUB_REF_NAME}-${{ matrix.asset }}${ext}"
      - name: Publish CLI+TUI bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: dist/cli-tui/out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: release
    if: github.repository == 'Wayshard/wayshard'
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          # Intel macOS Desktop: the CLI/TUI matrix already ships darwin-amd64;
          # the desktop client must too. package-desktop.sh names the dmg from
          # uname -m, so this produces macos-x86_64.dmg alongside aarch64.
          - os: macos-15-intel
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebKit deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf squashfs-tools
      - name: Install JS deps and build web
        run: bun install --frozen-lockfile && bun run --cwd web build
        working-directory: clients
      - name: Set Tauri version from tag
        shell: bash
        run: bash scripts/release/set-tauri-version.sh "${{ github.ref_name }}"
      - name: Build desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: bunx tauri build
        working-directory: clients/desktop
      - name: Fix AppImage .DirIcon
        if: matrix.target == 'linux'
        run: |
          for img in clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage; do
            [ -f "$img" ] || continue
            bash scripts/release/appimage-fix-diricon.sh "$img"
          done
      - name: Verify macOS ad-hoc signature
        if: matrix.target == 'macos'
        run: bash scripts/release/macos-verify-adhoc.sh clients/desktop/src-tauri/target/release/bundle
      - name: Name desktop artifacts
        shell: bash
        run: |
          mkdir -p dist/desktop
          bash scripts/release/package-desktop.sh "${GITHUB_REF_NAME}" "${{ matrix.target }}" \
            clients/desktop/src-tauri/target/release/bundle dist/desktop
      - name: Self-sign Windows installers
        if: matrix.target == 'windows'
        env:
          WAYSHARD_WINDOWS_PFX_BASE64: ${{ secrets.WAYSHARD_WINDOWS_PFX_BASE64 }}
          WAYSHARD_WINDOWS_PFX_PASSWORD: ${{ secrets.WAYSHARD_WINDOWS_PFX_PASSWORD }}
        shell: pwsh
        run: powershell -File scripts/release/windows-sign.ps1 dist/desktop
      - name: Remove Windows PFX
        if: always() && matrix.target == 'windows'
        shell: bash
        run: bash scripts/release/windows-cleanup.sh
      - name: Checksums (desktop, single-runner targets)
        if: matrix.target != 'macos'
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/release/checksums.py --out "dist/desktop/SHA256SUMS-desktop-${{ matrix.target }}.txt" dist/desktop/*
      - name: Upload desktop artifacts
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: dist/desktop/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-macos-checksums:
    # Both macOS DMGs are built on separate matrix runners. Generating the
    # per-component SHA256SUMS-desktop-macos.txt inside the matrix made the two
    # runners race to upload the same asset name, so the published file could
    # list only one architecture. This runs once, after the whole matrix, and
    # writes both aarch64 and x86_64 rows exactly once.
    name: Desktop macOS checksums (both architectures)
    needs: desktop
    if: github.repository == 'Wayshard/wayshard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS desktop installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p desktop-macos
          gh release download "${GITHUB_REF_NAME}" \
            -p "wayshard-desktop-${GITHUB_REF_NAME}-macos-*.dmg" -D desktop-macos
      - name: Generate per-component macOS checksums
        run: |
          bash scripts/release/desktop-macos-checksums.sh \
            "${GITHUB_REF_NAME}" desktop-macos SHA256SUMS-desktop-macos.txt
      - name: Upload macOS checksums
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: SHA256SUMS-desktop-macos.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android APK (Tauri 2, signed)
    needs: release
    if: github.repository == 'Wayshard/wayshard'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Build web
        run: bun install --frozen-lockfile && bun run --cwd web build
        working-directory: clients
      - name: Set Tauri version from tag
        shell: bash
        run: bash scripts/release/set-tauri-version.sh "${{ github.ref_name }}"
      - name: Resolve Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [[ -z "$ndk" || ! -d "$ndk" ]]; then
            ndk="$(ls -d "$sdk"/ndk-* "$sdk"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          test -n "$ndk" && test -d "$ndk"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "using NDK $ndk"
      - name: Init Tauri Android project
        working-directory: clients/desktop
        run: bunx tauri android init --ci
      - name: Generate Wayshard Android launcher icons
        run: bash scripts/release/android-icons.sh
      - name: Install Android Keystore credential helper
        run: bash scripts/release/android-keystore-patch.sh
      - name: Set Android version metadata
        run: bash scripts/release/android-version-properties.sh
      - name: Materialize Android signing keystore
        env:
          WAYSHARD_ANDROID_KEYSTORE_BASE64: ${{ secrets.WAYSHARD_ANDROID_KEYSTORE_BASE64 }}
          WAYSHARD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WAYSHARD_ANDROID_KEYSTORE_PASSWORD }}
          WAYSHARD_ANDROID_KEY_ALIAS: ${{ secrets.WAYSHARD_ANDROID_KEY_ALIAS }}
          WAYSHARD_ANDROID_KEY_PASSWORD: ${{ secrets.WAYSHARD_ANDROID_KEY_PASSWORD }}
        run: bash scripts/release/android-sign.sh
      - name: Build signed Android APK
        working-directory: clients/desktop
        run: bunx tauri android build --apk
      - name: Package and verify signed APK
        run: |
          mkdir -p dist/android
          bash scripts/release/package-android.sh "${GITHUB_REF_NAME}" \
            clients/desktop/src-tauri/gen/android dist/android
      - name: Verify Keystore helper survived R8 in the signed APK
        run: |
          python3 scripts/release/android-keystore-verify.py \
            "dist/android/wayshard-${GITHUB_REF_NAME}-android.apk"
      - name: Checksums (Android)
        run: python3 scripts/release/checksums.py --out dist/android/SHA256SUMS-android.txt dist/android/*
      - name: Remove signing material
        if: always()
        run: bash scripts/release/android-cleanup.sh
      - name: Upload Android artifacts
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: dist/android/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Combined SHA256SUMS
    needs: [release, tui, desktop, desktop-macos-checksums, android]
    if: github.repository == 'Wayshard/wayshard'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p all-assets
          gh release download "${GITHUB_REF_NAME}" -D all-assets
      - name: Verify every expected CLI+TUI bundle is present
        run: |
          set -euo pipefail
          for asset in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            test -s "all-assets/wayshard-${GITHUB_REF_NAME}-${asset}.tar.gz" \
              || { echo "missing CLI+TUI bundle for ${asset}" >&2; exit 1; }
          done
          test -s "all-assets/wayshard-${GITHUB_REF_NAME}-windows-amd64.zip" \
            || { echo "missing CLI+TUI bundle for windows-amd64" >&2; exit 1; }
          echo "all CLI+TUI bundles present"
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Write combined checksums
        run: python3 scripts/release/checksums.py --out SHA256SUMS.txt all-assets/*
      - name: Minisign checksum manifest
        env:
          WAYSHARD_RELEASE_MINISIGN_KEY_BASE64: ${{ secrets.WAYSHARD_RELEASE_MINISIGN_KEY_BASE64 }}
          WAYSHARD_RELEASE_MINISIGN_PASSWORD: ${{ secrets.WAYSHARD_RELEASE_MINISIGN_PASSWORD }}
        run: |
          test -s keys/wayshard-release.minisign.pub
          bash scripts/release/minisign-sign.sh SHA256SUMS.txt
          bash scripts/release/minisign-verify.sh SHA256SUMS.txt keys/wayshard-release.minisign.pub
      - name: Upload combined checksums
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ env.IS_PRERELEASE }}
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          files: |
            SHA256SUMS.txt
            SHA256SUMS.txt.minisig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
