name: Release

on:
  push:
    tags:
      - "v*"

# Signing credentials are only available to this protected release job.
# Forks cannot trigger this workflow with production secrets.
permissions:
  contents: write

jobs:
  release:
    name: Official GitHub Release
    runs-on: ubuntu-latest
    if: github.repository == 'Wayshard/wayshard'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - name: Build web client
        run: |
          bun install --frozen-lockfile
          bun run build
        working-directory: clients
      - name: Embed web into server
        run: |
          rm -rf internal/webembed/dist
          mkdir -p internal/webembed/dist
          cp -a clients/web/dist/. internal/webembed/dist/
      - name: Cross-compile Server and CLI
        run: make build-cross VERSION=${GITHUB_REF_NAME} COMMIT=${GITHUB_SHA}
      - name: Checksums
        run: |
          cd bin
          sha256sum wayshard-server-* wayshard-* > SHA256SUMS.txt
      - name: SBOM (Go modules)
        run: |
          go version -m bin/wayshard-server-linux-amd64 > sbom-go-server.txt || true
          mkdir -p release
          cp NOTICE LICENSE THIRD_PARTY_NOTICES.md release/
          cp bin/SHA256SUMS.txt release/
          cp sbom-go-server.txt release/ || true
          cp bin/wayshard-server-* bin/wayshard-* release/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/**
            NOTICE
            LICENSE
            THIRD_PARTY_NOTICES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: release
    if: github.repository == 'Wayshard/wayshard'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebKit deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install JS deps and build web
        run: bun install && bun run --cwd web build
        working-directory: clients
      - name: Build desktop
        run: bunx tauri build
        working-directory: clients/desktop
      - name: Upload desktop artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: clients/desktop/src-tauri/target/release/bundle/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android APK (Tauri 2)
    needs: release
    if: github.repository == 'Wayshard/wayshard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Build web
        run: bun install && bun run --cwd web build
        working-directory: clients
      - name: Init and build Tauri Android
        working-directory: clients/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          bunx tauri android init --ci || true
          bunx tauri android build --apk
      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: clients/desktop/src-tauri/gen/android/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
