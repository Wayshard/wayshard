name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build server, CLI, fake ACP
        run: |
          go build -o wayshard-server ./cmd/wayshard-server
          go build -o wayshard ./cmd/wayshard
          go build -o wayshard-fake-acp ./cmd/wayshard-fake-acp

  clients:
    name: Clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install client workspace
        run: bun install --frozen-lockfile
        working-directory: clients
      - name: Typecheck (sdk, ui, gui, web, tui, desktop)
        run: bun run typecheck
        working-directory: clients
      - name: SDK tests
        run: bun run test
        working-directory: clients/sdk
      - name: Graphical client tests (incl. source lineage)
        run: bun run test
        working-directory: clients/gui
      - name: TUI tests
        run: bun run test
        working-directory: clients/tui
      - name: Build web (shared graphical client)
        run: bun run build
        working-directory: clients/web
      - name: Rendered UI smoke (production build, headless Chrome)
        run: node scripts/ci/ui_render_smoke.mjs
        env:
          UI_SMOKE_SHOTS: ${{ runner.temp }}/ui-smoke


  tui:
    name: Interactive TUI (shipped path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install client workspace
        run: bun install --frozen-lockfile
        working-directory: clients
      - name: TUI tests
        run: bun run test
        working-directory: clients/tui
      - name: Build packaged TUI companion
        run: TUI_OUTFILE="$PWD/wayshard-tui" bun run build.ts
        working-directory: clients/tui
      - name: Smoke shipped interactive path
        run: bash scripts/ci/tui_smoke.sh

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install minisign (throwaway key self-test only)
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Checksum uniqueness and script self-tests
        run: make release-scripts-test

  native-security:
    name: Native security (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
          - name: macos-intel
            os: macos-15-intel
          - name: windows-amd64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Native sandbox security tests (verbose)
        run: go test ./internal/sandbox/ -run 'Native|Required|Windows|Feature|Seatbelt|Darwin' -v -count=1
      - name: macOS setsid cancellation is mandatory (must not skip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/sandbox/ -run 'TestNativeSetsidDescendantReconciled' -v -count=1 | tee setsid.log
          grep -q -- '--- PASS: TestNativeSetsidDescendantReconciled' setsid.log
      - name: macOS ownership lifecycle is mandatory (must not skip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/harness/ -run 'TestDarwin(FinishProcessOwnerReconcilesDetached|CleanProbeLeavesNoActiveOwner|DetachedProbeReconciledOnRestart|CleanProbeTwoStart|ACPExecReconcilesProcessOwner|ToolReleaseReconcilesDetached)' -v -count=1 | tee owner.log
          grep -c -- '--- PASS: TestDarwin' owner.log | grep -q '^6$'
      - name: macOS validation detached-child is mandatory (must not skip)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/validation/ -run 'TestDarwinValidationReconcilesDetached' -v -count=1 | tee val.log
          grep -q -- '--- PASS: TestDarwinValidationReconcilesDetached' val.log
      - name: Native sandbox full package
        run: go test ./internal/sandbox/ -count=1
      - name: Process ownership / recovery / harness packages
        run: go test ./internal/process/ ./internal/recovery/ ./internal/harness/ -count=1

  canonicals:
    name: Canonicals present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require six canonical documents
        run: |
          for f in AGENTS.md DESIGN.md SPEC.md ARCHITECTURE.md MEMORY.md README.md LICENSE NOTICE docs/release.md keys/README.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
