name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -timeout 10m
      - name: Build server, CLI, fake ACP
        run: |
          go build -o wayshard-server ./cmd/wayshard-server
          go build -o wayshard ./cmd/wayshard
          go build -o wayshard-fake-acp ./cmd/wayshard-fake-acp

  clients:
    name: Clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install client workspace
        run: bun install --frozen-lockfile
        working-directory: clients
      - name: Typecheck (sdk, ui, gui, web, tui, desktop)
        run: bun run typecheck
        working-directory: clients
      - name: SDK tests
        run: bun run test
        working-directory: clients/sdk
      - name: Graphical client tests (incl. source lineage)
        run: bun run test
        working-directory: clients/gui
      - name: TUI tests
        run: bun run test
        working-directory: clients/tui
      - name: Build web (shared graphical client)
        run: bun run build
        working-directory: clients/web
      - name: Rendered UI smoke (production build, headless Chrome)
        run: node scripts/ci/ui_render_smoke.mjs
        env:
          UI_SMOKE_SHOTS: ${{ runner.temp }}/ui-smoke


  tauri-android:
    name: Tauri Android target check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Compile the Android-target Rust path
        run: make android-check


  android-keystore-r8:
    name: Android Keystore R8 keep rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - name: Real R8 keep-rule and DEX gate (must not skip)
        env:
          WAYSHARD_REQUIRE_R8: "1"
        run: bash scripts/release/android_keystore_verify_test.sh


  tui:
    name: Interactive TUI (shipped path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install client workspace
        run: bun install --frozen-lockfile
        working-directory: clients
      - name: TUI tests
        run: bun run test
        working-directory: clients/tui
      - name: Build packaged TUI companion
        run: TUI_OUTFILE="$PWD/wayshard-tui" bun run build.ts
        working-directory: clients/tui
      - name: Smoke shipped interactive path
        run: bash scripts/ci/tui_smoke.sh

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install minisign and nsis (throwaway/self-test tooling only)
        run: sudo apt-get update && sudo apt-get install -y minisign nsis
      - name: Checksum uniqueness and script self-tests
        env:
          WAYSHARD_REQUIRE_NSIS: "1"
        run: make release-scripts-test

  canonicals:
    name: Canonicals present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require six canonical documents
        run: |
          for f in AGENTS.md DESIGN.md SPEC.md ARCHITECTURE.md MEMORY.md README.md LICENSE NOTICE docs/release.md keys/README.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
