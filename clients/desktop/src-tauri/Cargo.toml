[package]
name = "wayshard-desktop"
version = "0.0.0"
description = "Wayshard graphical client (Desktop + Android via Tauri 2)"
authors = ["Wayshard"]
edition = "2021"
license = "MIT"

[lib]
name = "wayshard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform-secure credential storage on desktop targets (macOS Keychain,
# Windows Credential Manager, Linux Secret Service). Android uses app-private
# storage instead; the keyring crate has no Android backend.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
