# Wayshard shipped harness catalog.
#
# This file is the default catalog of harness families Wayshard knows how to
# discover and support. It is embedded in the Wayshard binaries. Users may
# override or extend it with a user catalog (see the Wayshard documentation);
# the user file is merged by harness `id`.
#
# The catalog describes how Wayshard recognizes, probes and invokes a harness
# family. Discovered harnesses run as the Wayshard server OS user with their
# normal configuration, authentication, environment, filesystem and network
# access; the catalog is a discovery/launch declaration, not a containment
# policy.
#
# Fields:
#   enabled                  bool   (default true)
#   display_name             string
#   homepage                 string
#   platforms                list   (linux|darwin|windows; default all)
#   executables              list   primary CLI executable names (bare names)
#   bridges                  list   separate ACP bridge executable names
#   well_known               list   extra home-relative search directories
#   version_args             list   argv for the version probe
#   acp                      native|bridge (default: bridge if bridges set)
#   acp_args                 list   argv for native ACP
#   bridge_args              list   argv for bridge ACP
#   interpose_commands       bool   harness uses ACP terminal/fs callbacks
#   model_selection          none|config_option|set_model
#
# Sources for ACP invocations: the official Agent Client Protocol registry
# (https://agentclientprotocol.com/get-started/registry) and official project
# documentation. Wayshard never imports the live registry at runtime and never
# installs harnesses or bridges.

schema_version = 1

[[harness]]
id = "opencode"
display_name = "OpenCode"
homepage = "https://opencode.ai"
executables = ["opencode"]
well_known = [".opencode/bin"]
version_args = ["--version"]
acp = "native"
acp_args = ["acp"]
interpose_commands = true
model_selection = "config_option"

[[harness]]
id = "codex"
display_name = "Codex"
homepage = "https://github.com/agentclientprotocol/codex-acp"
executables = ["codex"]
bridges = ["codex-acp"]
version_args = ["--version"]
acp = "bridge"
bridge_args = []
interpose_commands = true
model_selection = "set_model"

